name: CI - Main (Build, Test, Sonar & Deploy)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: list-service-main-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  packages: write

jobs:
  build-test-sonar:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ghcr.io/shopisel/list-service

    defaults:
      run:
        working-directory: src

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Install SonarScanner
      run: dotnet tool install --global dotnet-sonarscanner

    - name: Restore dependencies
      run: dotnet restore

    - name: Begin SonarCloud analysis
      run: |
        dotnet sonarscanner begin \
        /k:"shopisel_list-service" \
        /o:"shopisel" \
        /d:sonar.login="${{ secrets.SONAR_TOKEN }}" \
        /d:sonar.host.url="https://sonarcloud.io" \
        /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
        /d:sonar.coverage.exclusions="**/Data/Migrations/**,**/Program.cs,**/Data/Entities/**" \
        /d:sonar.scanner.scanAll=false

    - name: Build
      run: dotnet build --no-restore

    - name: Test with coverage
      run: dotnet test --collect:"XPlat Code Coverage;Format=opencover" --results-directory ./TestResults

    - name: List coverage reports
      run: find . -type f -name "coverage.opencover.xml" -print

    - name: End SonarCloud analysis
      run: dotnet sonarscanner end /d:sonar.login="${{ secrets.SONAR_TOKEN }}"

    - name: Log in to GitHub Container Registry
      if: github.event_name == 'push'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      if: github.event_name == 'push'
      uses: docker/build-push-action@v6
      with:
        context: src
        file: src/ListService/Dockerfile
        push: true
        tags: |
          ${{ env.IMAGE_NAME }}:${{ github.sha }}
          ${{ env.IMAGE_NAME }}:latest

    - name: Set up Flyctl
      if: github.event_name == 'push'
      uses: superfly/flyctl-actions/setup-flyctl@master

    - name: Deploy to Fly.io
      if: github.event_name == 'push'
      env:
        FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      run: flyctl deploy --image ${{ env.IMAGE_NAME }}:${{ github.sha }}
