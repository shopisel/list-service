name: CI - Develop (Build & Test)

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Install SonarScanner
      run: dotnet tool install --global dotnet-sonarscanner

    - name: Restore dependencies
      run: dotnet restore

    - name: Begin SonarCloud analysis
      run: |
        dotnet sonarscanner begin \
          /k:"shopisel_list-service" \
          /o:"shopisel" \
          /d:sonar.login="${{ secrets.SONAR_TOKEN }}" \
          /d:sonar.host.url="https://sonarcloud.io" \
          /d:sonar.cs.cobertura.reportsPaths="**/coverage.cobertura.xml" \
          /d:sonar.coverage.exclusions="**/Data/Migrations/**,**/Program.cs,**/Data/Entities/**"

    - name: Build
      run: dotnet build --no-restore

    - name: Test with coverage
      run: dotnet test --collect:"XPlat Code Coverage"

    - name: List coverage reports
      run: find . -type f -name "coverage.cobertura.xml" -print

    - name: End SonarCloud analysis
      run: dotnet sonarscanner end /d:sonar.login="${{ secrets.SONAR_TOKEN }}"